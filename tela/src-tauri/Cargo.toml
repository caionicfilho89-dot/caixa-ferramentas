[package]
name = "caixa-tela"
version = "1.7.0"
description = "Tela principal da Caixa de Ferramentas (Tauri)"
edition = "2021"

[[bin]]
name = "CaixaTela"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
